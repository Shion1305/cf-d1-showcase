name: Deploy tested artifact

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.url }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      PROJECT_NAME: cf-d1-showcase
      RELEASE_SHA: ${{ github.sha }}
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.1
          terraform_wrapper: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: worker-${{ github.sha }}
      - name: Verify and unpack the tested build
        run: |
          sha256sum -c worker-build.tar.gz.sha256
          tar -xzf worker-build.tar.gz
      - name: Provision D1 and generate bindings
        run: |
          pnpm infra apply "$DEPLOY_ENV"
          pnpm config:generate "$DEPLOY_ENV"
      - name: Migrate and deploy
        run: pnpm release "$DEPLOY_ENV"
      - name: Verify real D1 writes
        run: node scripts/smoke-d1.mjs "$DEPLOY_ENV"
      - name: Resolve deployment URL
        id: url
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync(`.wrangler.${process.env.DEPLOY_ENV}.json`, 'utf8'));
          const subdomain = process.env.WORKERS_SUBDOMAIN;
          if (!/^[a-z0-9-]+$/.test(subdomain ?? '')) throw new Error('Set WORKERS_SUBDOMAIN to the account subdomain, without .workers.dev');
          appendFileSync(process.env.GITHUB_OUTPUT, `url=https://${config.name}.${subdomain}.workers.dev\n`);
          JS
      - name: Verify deployed application, schema, secret binding, and revision
        env:
          SMOKE_BASE_URL: ${{ steps.url.outputs.url }}
          EXPECTED_ENV: ${{ inputs.environment }}
          EXPECTED_SHA: ${{ github.sha }}
        run: pnpm test:smoke
