packages:
  - .
overrides:
  # Wrangler's Miniflare dependency currently pins a sharp release with vulnerable libheif.
  sharp: 0.35.4
allowBuilds:
  "@ast-grep/napi": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - "@types/node@22.20.2"
  - "@types/react-dom@19.3.0"
  - "@types/react@19.3.0"
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
